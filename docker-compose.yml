services:
  api:
    build: .
    ports:
      - "8000:8000"
    # Secrets injected at runtime only (never baked into image layers thanks
    # to .dockerignore); rotate any key you exposed before this fix.
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      - ./outputs:/app/outputs
      - ./temp:/app/temp
      - ./data:/app/data # durable job store (SQLite) survives restarts
